name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sigma-cli
        run: python -m pip install sigma-cli
      - name: Check the Sigma rules
        # --fail-on-issues makes validation issues fail the build, not only parse errors.
        run: |
          set -o pipefail
          sigma check --fail-on-issues rules/ 2>&1 | tee sigma-check.txt
      - name: Check that every rule has a playbook
        run: |
          for rule in rules/*.yml; do
            name="$(basename "$rule" .yml)"
            test -f "playbooks/$name.md" || { echo "missing playbook for $rule"; exit 1; }
          done
      - name: Write the check result to the job summary
        if: always()
        run: |
          {
            echo "### sigma check rules/"
            echo '```text'
            cat sigma-check.txt 2>/dev/null || echo "sigma check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
