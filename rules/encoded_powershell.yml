title: PowerShell Started With an Encoded Command
id: 36f176a4-6eef-4843-a250-59aebee0ecf4
status: experimental
description: Detects PowerShell being started with the EncodedCommand parameter or one of its short forms. The parameter takes a Base64 string, which attackers use to hide what the command does from people and from simple keyword filters.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Erik Salihu
date: 2026-11-13
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_parameter:
        CommandLine|contains:
            - ' -EncodedCommand '
            - ' -enc '
            - ' -ec '
            - ' -e '
    condition: selection_image and selection_parameter
falsepositives:
    - Software deployment and management tools that pass scripts to PowerShell in encoded form
    - Administrator scripts that encode a command to avoid quoting problems
level: medium
